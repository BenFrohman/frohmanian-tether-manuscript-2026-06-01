name: lean
on:
  push: {branches: [main]}
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: lean}
      - uses: leanprover/lean-action@v1
        with: {lake-package-directory: lean, use-mathlib-cache: true}
      - name: No sorry / native_decide
        run: "! grep -rnE 'sorry|native_decide|^axiom' lean/MirrorMetriplectic"
      - name: Axiom audit
        working-directory: lean
        run: |
          lake env lean AxiomAudit.lean | tee audit.txt
          ! grep -vE "\[propext, Classical.choice, Quot.sound\]" audit.txt | grep axioms
